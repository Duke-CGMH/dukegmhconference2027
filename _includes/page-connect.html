{% assign p = site.data.cms.connect %}
<section class="page-title"{% if p.title_background != '' %} style="--title-image:url('{{ p.title_background }}')"{% endif %}><div class="inner"><div class="eyebrow">{{ p.eyebrow }}</div><h1>{{ p.title }}</h1></div></section>
<article class="article connect-article"><div class="connect-layout"><div class="connect-copy">{{ p.body }}</div><figure class="page-image connect-primary">{% if p.cgmh_image != '' %}<img src="{{ p.cgmh_image }}" alt="{{ p.cgmh_image_alt }}">{% else %}<div class="image-placeholder"><strong>{{ p.cgmh_image_alt }}</strong><span>Add the first Connect page photo in the editor</span><code>assets/images/</code></div>{% endif %}</figure><figure class="page-image connect-secondary">{% if p.secondary_image != '' %}<img src="{{ p.secondary_image }}" alt="{{ p.secondary_image_alt }}">{% else %}<div class="image-placeholder"><strong>{{ p.secondary_image_alt }}</strong><span>Add the second Connect page photo in the editor</span><code>assets/images/</code></div>{% endif %}</figure></div></article>
